<meta charset="utf-8">
<title>card-a</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
  html,body{margin:0;height:100%;background:#0A1128}
  .card{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
        background:radial-gradient(120% 90% at 50% 38%, #10204a 0%, #0A1128 62%)}
  .eye{font-family:'Space Mono',monospace;font-weight:700;font-size:2.0vw;letter-spacing:.24em;color:#00B4D8;text-transform:uppercase;margin-bottom:4.5vh}
  .mark{width:34vh;height:34vh;filter:drop-shadow(0 0 6vh rgba(0,180,216,.28))}
  .wm{font-family:'Space Mono',monospace;font-weight:700;font-size:8.6vh;letter-spacing:.02em;color:#F5F7FA;margin-top:4.5vh;line-height:1}
  .wm .o{color:#00B4D8}
  .sub{font-family:'Space Mono',monospace;font-size:2.0vh;letter-spacing:.16em;color:#5C6670;text-transform:uppercase;margin-top:3.2vh}
</style>
<div class="card">
  <div class="eye">Technocore</div>
  <svg class="mark" viewBox="0 0 700 700" aria-label="Technocore mark"></svg>
  <div class="wm">TECHN<span class="o">O</span>CORE</div>
  <div class="sub">the core is a chip</div>
</div>
<script>
  var CELL=100,GUT=.10,RX=7,N=7,C=3,B=CELL*(1-GUT),I=(CELL-B)/2,s='';
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    if(Math.min(r,N-1-r)+Math.min(c,N-1-c)<2)continue; if(r===C&&c===C)continue;
    s+='<rect x="'+(c*CELL+I).toFixed(1)+'" y="'+(r*CELL+I).toFixed(1)+'" width="'+B.toFixed(1)+'" height="'+B.toFixed(1)+'" rx="'+RX+'" fill="#00B4D8"/>';
  }
  document.querySelector('.mark').innerHTML=s;
</script>
